name: Build Antigem APK

# Builds an installable APK of the linked project
# https://github.com/Santoshkurmi/antigem (antiGem — mobile IDE for Antigravity
# CLI / Claude CLI) straight from its source tag, and publishes it to the
# rolling "antigem-apk" release of THIS repo so it can be downloaded on a phone.
#
# Upstream ships release APKs signed with a keystore that only exists in its own
# repo secrets, so this workflow signs with a keystore generated here
# (app/release.jks, quoted in antigem's build.gradle.kts as 123456/antigem).
# The result is a fully working release-mode APK with a stable key of its own:
# new builds install over old ones.
#
# antigem: minSdk 24, targetSdk 28  ->  runs on Android 10 (API 29) and older/newer.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git tag/branch of Santoshkurmi/antigem to build'
        required: true
        default: 'v1.0.17'
  schedule:
    - cron: '0 4 * * *' # daily check for a newer upstream tag
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - '.github/workflows/build-antigem-apk.yml'

permissions:
  contents: write

concurrency:
  group: antigem-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Resolve upstream ref (latest tag unless pinned by input)
        id: up
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.ref }}"
          else
            git init -q upstream-probe && cd upstream-probe
            git remote add origin https://github.com/Santoshkurmi/antigem.git
            REF=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | sort -V | tail -1)
            cd .. && rm -rf upstream-probe
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building Santoshkurmi/antigem @ $REF"

      - name: Clone upstream source (pinned tag)
        run: |
          git clone --depth 1 --branch "${{ steps.up.outputs.ref }}" \
            https://github.com/Santoshkurmi/antigem.git src
          cd src && git log -1 --oneline && cat version.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform 36 + build-tools
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK" -name sdkmanager -maxdepth 5 | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # Stable signing key, generated once and reused for every later run.
      - name: Restore or create release keystore
        id: ks
        uses: actions/cache@v4
        with:
          path: ~/.antigem/release.jks
          key: antigem-release-keystore-v1

      - name: Install keystore into the project
        run: |
          mkdir -p ~/.antigem
          if [ ! -f ~/.antigem/release.jks ]; then
            keytool -genkeypair -v -keystore ~/.antigem/release.jks \
              -alias antigem -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 123456 -keypass 123456 \
              -dname "CN=antiGem, OU=Android, O=antiGem, L=NA, S=NA, C=IN"
          fi
          cp ~/.antigem/release.jks src/app/release.jks
          ls -l src/app/release.jks

      - name: Build release APKs (termux required, standard best-effort)
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleTermuxRelease --stacktrace
          ./gradlew --no-daemon :app:assembleStandardRelease --stacktrace \
            || echo "::warning::standard flavor failed to build; shipping termux flavor only"

      - name: Collect artifacts
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('src/version.json'))['version_name'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p out
          termux=$(find src/app/build/outputs/apk/termux/release -name '*.apk' | head -1)
          cp "$termux" "out/antiGem-termux-v${VERSION}-android10.apk"
          echo "ANTIGEM_TERMUX=out/antiGem-termux-v${VERSION}-android10.apk" >> "$GITHUB_ENV"
          standard=$(find src/app/build/outputs/apk/standard/release -name '*.apk' 2>/dev/null | head -1 || true)
          if [ -n "$standard" ]; then
            cp "$standard" "out/antiGem-standard-v${VERSION}-android10.apk"
            echo "ANTIGEM_STANDARD=out/antiGem-standard-v${VERSION}-android10.apk" >> "$GITHUB_ENV"
          fi
          ls -lh out

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: antigem-apk-${{ env.VERSION }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish to rolling "antigem-apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="antiGem ${{ env.VERSION }} built from https://github.com/Santoshkurmi/antigem at tag ${{ steps.up.outputs.ref }}.
          Mobile IDE wrapping the Antigravity CLI (Gemini) and Claude CLI with a code editor, AI chat, Git client and Termux terminal.
          Installable release APK, minSdk 24 — works on Android 10 (API 29) and newer. Signed with this repo's own stable key, so updates install over older builds.
          \`antiGem-termux-v${VERSION}-android10.apk\` = package com.termux (replaces/coexists per upstream design)."
          if gh release view antigem-apk > /dev/null 2>&1; then
            gh release edit antigem-apk --title "antiGem — Android 10 APK (latest)" --notes "$NOTES" --prerelease
          else
            gh release create antigem-apk --title "antiGem — Android 10 APK (latest)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload antigem-apk out/*.apk --clobber
